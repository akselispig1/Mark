<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MARK</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --gold: 255, 196, 64; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 300 13px/1.5 "Segoe UI", system-ui, sans-serif; color: rgba(var(--gold), .75); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #caption { position: fixed; left: 50%; bottom: 14vh; transform: translateX(-50%);
    width: min(560px, 86vw); text-align: center; letter-spacing: .02em;
    transition: opacity .6s; opacity: 0; pointer-events: none; }
  #caption.on { opacity: 1; }
  #state { position: fixed; left: 50%; top: 8vh; transform: translateX(-50%);
    font-size: 10px; letter-spacing: .5em; text-transform: uppercase; color: rgba(var(--gold), .35); }
  #call { position: fixed; right: 22px; bottom: 22px; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(var(--gold), .25); background: none; color: rgba(var(--gold), .6);
    cursor: pointer; display: grid; place-items: center; transition: .3s; }
  #call:hover { border-color: rgba(var(--gold), .7); color: rgb(var(--gold)); box-shadow: 0 0 18px rgba(var(--gold), .35); }
  #call svg, .corner svg { width: 15px; height: 15px; }
  .corner { position: fixed; left: 22px; bottom: 22px; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(var(--gold), .25); background: none; color: rgba(var(--gold), .6);
    cursor: pointer; display: grid; place-items: center; transition: .3s; }
  .corner:hover { border-color: rgba(var(--gold), .7); color: rgb(var(--gold)); box-shadow: 0 0 18px rgba(var(--gold), .35); }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55);
    backdrop-filter: blur(6px); z-index: 5; text-align: center; letter-spacing: .08em; }
  #overlay img { width: min(260px, 70vw); border-radius: 10px; box-shadow: 0 0 60px rgba(var(--gold), .25); }
  #overlay p { margin: 18px 0 0; color: rgba(var(--gold), .6); font-size: 12px; }
  #ring { position: fixed; inset: 0; z-index: 4; display: grid; align-content: end; justify-items: center;
    padding-bottom: 20vh; pointer-events: none; }
  #ring b { font-weight: 300; letter-spacing: .5em; font-size: 12px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  #hangup { position: fixed; left: 50%; bottom: calc(5vh + 44px); transform: translateX(-50%); z-index: 3;
    width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,90,60,.5); background: none;
    color: rgba(255,120,90,.9); cursor: pointer; display: grid; place-items: center; }
  #hangup svg { width: 20px; height: 20px; transform: rotate(135deg); }
  #hand { left: auto; right: 22px; top: 22px; bottom: auto; }
  #hand.grab { transform: scale(1.15); background: rgba(var(--gold), .15); }
  #hand.on { border-color: rgba(var(--gold), .8); color: rgb(var(--gold)); box-shadow: 0 0 18px rgba(var(--gold), .4); }
  #handview { position: fixed; right: 22px; top: 70px; width: 168px; height: 126px; border-radius: 10px;
    border: 1px solid rgba(var(--gold), .22); background: #000; z-index: 2; }
  #vaultBtn { left: 22px; top: 22px; bottom: auto; }
  #vaultBtn.on { border-color: rgba(var(--gold), .8); color: rgb(var(--gold)); box-shadow: 0 0 18px rgba(var(--gold), .4); }
  #vault { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(0,0,0,.6); backdrop-filter: blur(8px); }
  .vcard { position: relative; width: min(440px, 92vw); max-height: 86vh; overflow: auto; padding: 26px 24px 20px;
    border: 1px solid rgba(var(--gold), .25); border-radius: 14px; background: rgba(12,10,4,.92); box-shadow: 0 0 60px rgba(var(--gold), .12); }
  .vcard h3 { margin: 0 0 14px; font-weight: 300; font-size: 11px; letter-spacing: .45em; color: rgb(var(--gold)); }
  .vcard input { display: block; width: 100%; margin: 0 0 8px; padding: 9px 10px; background: rgba(0,0,0,.5); color: rgba(var(--gold), .95);
    border: 1px solid rgba(var(--gold), .2); border-radius: 8px; font: inherit; outline: none; }
  .vcard input:focus { border-color: rgba(var(--gold), .6); }
  .vcard button { background: none; border: 1px solid rgba(var(--gold), .3); color: rgba(var(--gold), .85); border-radius: 7px;
    padding: 5px 9px; font: inherit; font-size: 11px; cursor: pointer; }
  .vcard button:hover { border-color: rgba(var(--gold), .8); color: rgb(var(--gold)); }
  .vcard .vgo { width: 100%; padding: 9px; margin-top: 4px; font-size: 12px; letter-spacing: .2em; }
  .vcard .vx { position: absolute; right: 12px; top: 10px; border: none; font-size: 18px; padding: 0 6px; }
  .vcard .vlock { margin-top: 14px; }
  .vlist { margin: 6px 0 14px; max-height: 38vh; overflow: auto; }
  .vrow { display: flex; gap: 6px; align-items: center; padding: 8px 2px; border-bottom: 1px solid rgba(var(--gold), .08); flex-wrap: wrap; }
  .vname { flex: 1; min-width: 120px; }
  .vname small { display: block; opacity: .5; font-size: 11px; }
  .vrow code { flex-basis: 100%; order: 9; font: 12px Consolas, monospace; color: rgb(255,225,150); word-break: break-all; }
  .vadd { border-top: 1px solid rgba(var(--gold), .15); padding-top: 12px; }
  .vpw { display: flex; gap: 6px; } .vpw input { flex: 1; }  .vpw button { margin-bottom: 8px; }
  .vnote { font-size: 11px; opacity: .55; margin: 6px 0 10px; line-height: 1.5; }
  .verr { font-size: 12px; color: #ff9a7a; margin: 8px 0 0; }
  .vsec { border-top: 1px solid rgba(var(--gold), .15); margin-top: 14px; padding-top: 12px; display: grid; gap: 8px; }
  .vsec div { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
  .vsec b { font-weight: 400; color: rgb(var(--gold)); }
  .vcode { font: 13px Consolas, monospace; color: #ffe2a0; background: rgba(var(--gold), .08); padding: 6px 8px; border-radius: 6px; word-break: break-all; user-select: all; }
  #approve { position: fixed; left: 50%; top: 16vh; transform: translateX(-50%); z-index: 7; width: min(380px, 90vw); text-align: center;
    padding: 18px 18px 14px; border: 1px solid rgba(var(--gold), .45); border-radius: 14px; background: rgba(12,10,4,.95); box-shadow: 0 0 60px rgba(var(--gold), .2); }
  #approve p { margin: 0 0 12px; color: #ffe2a0; }
  #approve button { margin: 4px; padding: 9px 14px; border-radius: 8px; font: inherit; cursor: pointer; background: rgba(var(--gold), .12); color: rgb(var(--gold)); border: 1px solid rgba(var(--gold), .5); }
  #approve button.no { background: none; border-color: rgba(255,120,90,.4); color: rgba(255,150,120,.9); }
  #approve small { display: block; opacity: .55; margin-top: 6px; font-size: 11px; }
  #type { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); width: min(420px, 80vw);
    background: none; border: none; border-bottom: 1px solid rgba(var(--gold), .15); outline: none;
    color: rgba(var(--gold), .8); font: inherit; text-align: center; padding: 6px; }
  #type::placeholder { color: rgba(var(--gold), .2); }
  #type:focus { border-bottom-color: rgba(var(--gold), .45); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="state">offline</div>
<div id="caption"></div>
<input id="type" placeholder="say “Mark…” or type" autocomplete="off">
<button id="pair" class="corner" title="Pair your phone" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
</button>
<button id="bell" class="corner" title="Let Mark call this phone" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
</button>
<button id="hand" class="corner" title="Hand control (camera): pinch + spread to zoom">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg>
</button>
<button id="vaultBtn" class="corner" title="Password vault">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M16 7l3 3M18.5 4.5l2 2"/></svg>
</button>
<canvas id="handview" width="336" height="252" hidden></canvas>
<div id="approve" hidden></div>
<div id="overlay" hidden></div>
<div id="ring" hidden><b>INCOMING · TAP THE ORB TO ANSWER</b></div>
<button id="hangup" title="Hang up" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
</button>
<button id="call" title="Have Mark ring your phone">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
</button>
<script>
/* ---------- Orb ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
var W, H, DPR;   // var so the HUD can read window.H
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR; }
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
// Shell particles on lat/long so they can flow in swirling bands.
const N = 2200, shell = [];
for (let i = 0; i < N; i++) {
  const lat = Math.asin(1 - (i / (N - 1)) * 2), lon = i * 2.39996323;
  shell.push({ lat, lon, ph: Math.random() * TAU, spd: .5 + Math.random(), out: 1 + Math.random() * 1.8 });
}
// Orbital lines: a gyroscope of rings at different sizes and tilts, each slowly precessing.
// Every third ring carries a comet; a few are dashed, like instrument markings.
const rings = Array.from({ length: 14 }, (_, i) => ({
  tiltX: (i * 1.618) % Math.PI - Math.PI / 2,
  tiltZ: (i * 2.399) % TAU,
  r: 1.25 + (i % 7) * .13 + (i > 6 ? .06 : 0),
  // each orbit has 1-3 bodies, all at different speeds and directions
  bodies: Array.from({ length: 1 + (i % 3) }, (_, k) => ({
    speed: (i % 2 ? -1 : 1) * (.08 + ((i * 7 + k * 3) % 13) * .045) * (k % 2 ? -1 : 1),
    phase: i * 1.3 + k * 2.1,
    size: .6 + ((i + k) % 4) * .35,
    tail: 10 + ((i * 5 + k * 11) % 36),
  })),
  precess: (i % 3 - 1) * .04,
  dashed: i % 4 === 1,
  weight: i % 5 === 0 ? 1.4 : .8,
}));
const sparks = [];

let mode = 'idle', level = 0, target = 0, t = 0;
// View state driven by touch: rotation, zoom, and "burst" expansion.
let yaw = 0, pitch = .35, vYaw = .004, vPitch = 0, zoom = 1, zoomTarget = 1, burst = 0, burstTarget = 0, burstVel = 0;
let dragging = false;
var handTarget = null;            // set by hand.js while you spin with your hand; the orb eases toward it
// Boot sequence: the orb ignites, then the HUD rings sweep in and the readouts come online.
const bootStart = performance.now();
let boot = 0, hudSweep = 0, bootDone = false;
const PROFILE = { idle: [.3, .0012], listening: [.65, .002], thinking: [.5, .008], speaking: [.85, .003], offline: [.1, .0005] };

function project(x, y, z) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = x * cy - z * sy; let z1 = x * sy + z * cy;
  const y1 = y * cp - z1 * sp; z1 = y * sp + z1 * cp;
  return [x1, y1, z1];
}

let fps = 60, lastFrameAt = 0, lowPower = false;
function frame() {
  const nowMs = performance.now();
  if (lastFrameAt) fps += (1000 / Math.max(1, nowMs - lastFrameAt) - fps) * .1;
  lastFrameAt = nowMs;
  lowPower = fps < 45;                       // e.g. while hand tracking shares the graphics chip
  window.__fps = fps;
  t += 1 / 60;
  boot = Math.min(1, (performance.now() - bootStart) / 2800);
  hudSweep = 1 - Math.pow(1 - Math.min(1, Math.max(0, (boot - .25) / .6)), 3);
  if (boot === 1 && !bootDone) { bootDone = true; caption('All systems online.', 2500); }
  const [bright, spin] = PROFILE[mode];
  if (mode === 'speaking') target = .15 + .85 * audioLevel();
  if (mode === 'thinking') target = .3 + .2 * Math.sin(t * 4);
  if (mode === 'idle' || mode === 'offline') target = .08 + .06 * Math.sin(t * 1.2);
  level += (target - level) * .12;

  if (handTarget) {                          // smooth hand spin: glide toward where your hand points
    const dy = (handTarget.yaw - yaw) * .25, dp = (handTarget.pitch - pitch) * .25;
    yaw += dy; pitch += dp; vYaw = dy; vPitch = dp;
  }
  if (!dragging) { yaw += vYaw; pitch += vPitch; vYaw += (spin - vYaw) * .02; vPitch *= .95; pitch += (.35 - pitch) * .01; }
  zoom += (zoomTarget - zoom) * .16;                       // glides to the new size instead of snapping
  burstVel += (burstTarget - burst) * .06; burstVel *= .82; burst += burstVel;   // springy expand / collapse

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(0, 0, W, H);
  const ignite = 1 - Math.pow(1 - Math.min(1, boot / .35), 3);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * .12 * zoom * (1 + level * .15) * (.05 + .95 * ignite);

  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * (2.8 + burst * 2));
  g.addColorStop(0, `rgba(255,185,50,${.16 * bright + level * .16})`);
  g.addColorStop(.4, `rgba(255,130,10,${.05 * bright + level * .05})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Plasma core: three drifting hot spots
  for (let k = 0; k < 3; k++) {
    const a = t * (.7 + k * .3) + k * 2.1, off = R * .04 * (1 + level);   // stays centred
    const px = cx + Math.cos(a) * off, py = cy + Math.sin(a * 1.3) * off;
    const c = ctx.createRadialGradient(px, py, 0, px, py, R * (.5 + level * .25));
    c.addColorStop(0, `rgba(255,${220 - k * 30},${140 - k * 40},${.18 + level * .3})`); c.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = c; ctx.fillRect(cx - R * 1.2, cy - R * 1.2, R * 2.4, R * 2.4);
  }

  // Shell particles flowing in bands
  for (let si = 0; si < shell.length; si += lowPower ? 2 : 1) {
    const p = shell[si];
    const lon = p.lon + t * .04 * p.spd * Math.sin(p.lat * 3 + t * .06);
    const wob = 1 + level * .2 * Math.sin(p.ph + t * 1.4 + p.lat * 5) + .015 * Math.sin(p.ph + t * .4) + burst * p.out * 1.4;
    const cl = Math.cos(p.lat);
    const [x, y, z] = project(Math.cos(lon) * cl, Math.sin(p.lat), Math.sin(lon) * cl);
    const d = (z + 1.6) / 2.6;
    const a = (.12 + .88 * d) * (.35 + bright * .65) * (1 - burst * .35);
    ctx.fillStyle = `rgba(255,${165 + 70 * d | 0},${50 + 110 * d * level | 0},${a})`;
    const s = (.6 + d * 1.5) * DPR;
    ctx.fillRect(cx + x * R * wob, cy + y * R * wob, s, s);
  }

  // Orbital lines + comets
  ctx.lineCap = 'round';
  for (const ring of rings) {
    const tz = ring.tiltZ + t * ring.precess;
    const cT = Math.cos(ring.tiltX), sT = Math.sin(ring.tiltX), cZ = Math.cos(tz), sZ = Math.sin(tz);
    const rr = ring.r * (1 + burst * .8) * (1 + level * .06);
    const pt = (ang) => {
      let x = Math.cos(ang) * rr, y = 0, z = Math.sin(ang) * rr;
      [y, z] = [y * cT - z * sT, y * sT + z * cT];
      [x, y] = [x * cZ - y * sZ, x * sZ + y * cZ];
      return project(x, y, z);
    };
    const SEG = lowPower ? 40 : 96, BANDS = 6;
    const pts = [];
    for (let i = 0; i <= SEG; i++) pts.push(pt(i / SEG * TAU));
    ctx.lineWidth = ring.weight * DPR;
    const glow = 1 + level + talkGlow() * 1.6;
    for (let b = 0; b < BANDS; b++) {                        // group segments by depth: front bands brighter
      const d = (b + .5) / BANDS;
      ctx.strokeStyle = `rgba(255,${175 + 50 * d | 0},70,${(.03 + .16 * d * d) * (.45 + bright) * glow})`;
      ctx.beginPath();
      let pen = false;
      for (let i = 1; i <= SEG; i++) {
        if (ring.dashed && i % 4 >= 2) { pen = false; continue; }
        const depth = ((pts[i - 1][2] + pts[i][2]) / 2 + 2) / 4;
        if (Math.min(BANDS - 1, Math.max(0, Math.floor(depth * BANDS))) !== b) { pen = false; continue; }
        if (!pen) { ctx.moveTo(cx + pts[i - 1][0] * R, cy + pts[i - 1][1] * R); pen = true; }
        ctx.lineTo(cx + pts[i][0] * R, cy + pts[i][1] * R);
      }
      ctx.stroke();
    }
    for (const body of ring.bodies) {
      const head = body.phase + t * body.speed;
      const dir = Math.sign(body.speed);
      for (let j = 0; j < (lowPower ? Math.min(12, body.tail) : body.tail); j++) {
        const [x, y, z] = pt(head - j * .016 * dir);
        const f = 1 - j / body.tail, d = (z + 2) / 4;
        ctx.fillStyle = `rgba(255,${200 + 55 * f | 0},${120 + 100 * f | 0},${f * f * (.35 + .5 * d) * (.6 + level * .6)})`;
        const sz = (.8 + 2 * f) * body.size * DPR;
        ctx.fillRect(cx + x * R - sz / 2, cy + y * R - sz / 2, sz, sz);
      }
    }
  }

  // MARK-style HUD: flat dial rings, tick scales, counter-rotating arc segments, circuit traces.
  drawHud(cx, cy, R, bright);

  // Sparks fly off when he talks loudly or when you burst it
  if (Math.random() < level * .9 + burst * .6) {
    const a = Math.random() * TAU, b = Math.acos(Math.random() * 2 - 1);
    sparks.push({ x: Math.sin(b) * Math.cos(a), y: Math.cos(b), z: Math.sin(b) * Math.sin(a), r: 1, v: .012 + Math.random() * .03, life: 1 });
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.r += s.v; s.life -= .015;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    const [x, y] = project(s.x * s.r, s.y * s.r, s.z * s.r);
    ctx.fillStyle = `rgba(255,220,150,${s.life * .8})`;
    ctx.fillRect(cx + x * R, cy + y * R, 1.6 * DPR, 1.6 * DPR);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);   // start after the whole script (HUD data etc.) is defined

/* ---------- HUD (Iron Man MARK style) ---------- */
// Circuit traces: leave the outer ring at an angle, run out, bend horizontal, end in a node + tiny readout.
// Live PC stats for the readouts (polled from the server every 2 s).
let live = {};
const pollStats = () => fetch('/stats').then(r => r.json()).then(d => (live = d)).catch(() => {});
pollStats(); setInterval(pollStats, 2000);
const pct = (v) => v == null ? '--' : String(v).padStart(2, ' ') + '%';
// Angles are relative to the outer ring (which sways), kept well clear of its 4 gaps so every trace stays attached.
const traces = [
  { a: -0.62, out: .55, run: 1.25, label: () => `MEM  ${pct(live.mem)}` },
  { a: -0.32, out: .35, run: .95,  label: () => `PWR  ${live.battery == null ? 'AC' : live.battery + '%' + (live.charging ? ' ⚡' : ' ▼')}` },
  { a: 0.42,  out: .45, run: 1.1,  label: () => `NET  ${live.ping == null ? 'offline' : live.ping + ' ms'}` },
  { a: Math.PI + 0.55, out: .5, run: 1.2, label: () => `CPU  ${pct(live.cpu)}` },
  { a: Math.PI - 0.35, out: .3, run: .9,  label: () => `TIME ${new Date().toTimeString().slice(0, 8)}` },

  refreshBell(); caption('Done. I can ring you on this phone now.');
};

// Opened from the "MARK is calling" notification.
const callId = new URLSearchParams(location.search).get('call');
if (callId !== null) { ringing = callId; $ring.hidden = false; setMode('listening', 'incoming'); navigator.vibrate?.([400, 200, 400]); }
function answerCall() {
  const id = ringing; ringing = null; $ring.hidden = true;
  audioGraph(); actx.resume();
  inCall = true; $hangup.hidden = false; awakeUntil = Infinity;
  const go = () => ws.send(JSON.stringify({ type: 'answer', id }));
  ws.readyState === 1 ? go() : ws.addEventListener('open', go, { once: true });
  history.replaceState(null, '', '/');
}
$hangup.onclick = () => {
  inCall = false; $hangup.hidden = true; awakeUntil = 0;
  stopSpeaking(); pauseEars(); setMode('idle', 'online'); caption('Call ended.', 2500);
};
</script>
<script src="/vendor/simplewebauthn/index.umd.min.js"></script>
<script>
/* ---------- Vault window + Windows Hello approvals ---------- */
const $vaultBtn = document.getElementById('vaultBtn');
$vaultBtn.onclick = () => window.open('/vault.html', 'mark-vault', 'width=560,height=840');
const $approve = document.getElementById('approve');
const postJson = (path, body) => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((r) => r.json());

window.vaultHello = () => ws?.readyState === 1 && ws.send(JSON.stringify({ type: 'vault', op: 'status' }));
window.vaultMessage = (m) => {
  if (m.type === 'approve') return showApproval(m);
  if (m.type === 'approval_done') { if ($approve.dataset.id === m.id) $approve.hidden = true; return; }
  if (m.type === 'vault' && m.status) { vaultState = m.status; $vaultBtn.classList.toggle('on', !!m.status.unlocked); }
  // He needs a password but the vault is shut. If your face can open it, just ask — no typing, no window.
  if (m.type === 'vault' && m.needUnlock) {
    if (vaultState?.helloUnlock && vaultState?.hello) askToOpenVault();
    else {
      caption('Your vault is locked — type your master password in the window that just opened.', 8000);
      window.open('/vault.html', 'mark-vault', 'width=560,height=840');
    }
  }
  if (m.helloUnlock) {
    window.__prf.helloAssert(m.helloUnlock)
      .then((r) => ws.send(JSON.stringify({ type: 'vault', op: 'hello_unlock', ...r })))
      .catch((e) => { $approve.hidden = true; caption(e.name === 'NotAllowedError' ? 'Left it locked, then.' : e.message, 5000); });
  }
  if (m.note === 'Unlocked with Windows Hello.') { $approve.hidden = true; caption('Vault open, sir.', 3000); }
};

let vaultState = null;
// A one-tap card: your face opens the vault and he carries on with what he was doing.
function askToOpenVault() {
  $approve.innerHTML = '';
  $approve.dataset.id = 'vault-unlock';
  const p = Object.assign(document.createElement('p'), { textContent: 'Your vault is locked. Open it?' });
  const yes = Object.assign(document.createElement('button'), { textContent: 'Open with Windows Hello' });
  const no = Object.assign(document.createElement('button'), { textContent: 'Not now', className: 'no' });
  yes.onclick = () => { yes.disabled = true; yes.textContent = 'Look at the camera…'; ws.send(JSON.stringify({ type: 'vault', op: 'hello_unlock_options' })); };
  no.onclick = () => ($approve.hidden = true);
  $approve.append(p, yes, no);
  $approve.hidden = false;
}

// Mark wants to use a password: confirm it's you with Windows Hello (or Face ID on a phone).
function showApproval(m) {
  const phone = /iPhone|iPad|Android/i.test(navigator.userAgent);
  const note = Object.assign(document.createElement('small'), { textContent: m.popup ? 'A confirmation window also opened next to your browser.' : '' });
  const yes = Object.assign(document.createElement('button'), { textContent: phone ? 'Approve with Face ID' : 'Approve with Windows Hello' });
  const no = Object.assign(document.createElement('button'), { textContent: 'Deny', className: 'no' });
  yes.onclick = () => approve(m.id, note);
  no.onclick = () => postJson('/approval/deny', { id: m.id }).then(() => ($approve.hidden = true));
  $approve.dataset.id = m.id;
  $approve.replaceChildren(Object.assign(document.createElement('p'), { textContent: m.text }), yes, no, note);
  $approve.hidden = false;
}

async function approve(id, note) {
  try {
    note.textContent = 'Look at your camera, or use your fingerprint or PIN…';
    const optionsJSON = await postJson('/approval/options', { id });
    if (optionsJSON.error) throw new Error(optionsJSON.error);
    const response = await SimpleWebAuthnBrowser.startAuthentication({ optionsJSON });
    const r = await postJson('/approval/verify', { id, response });
    if (!r.ok) throw new Error(r.error || 'Not approved.');
    $approve.hidden = true;
  } catch (e) { note.textContent = e.name === 'NotAllowedError' ? 'Cancelled. Press Approve to try again.' : e.message; }
}
</script>
